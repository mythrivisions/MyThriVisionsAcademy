<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="MyThri Visions Academy — Knowledge, Skills, Discipline and Success."><title>Student Registration | MyThri Visions Academy</title><link rel="stylesheet" href="style.css"></head><body data-page=""><div id="site-header"></div><main><section class="banner"><div class="crumb">Home / Student Registration</div><h1>Student Registration</h1><p>Share your details to start an admission enquiry.</p></section><section class="section"><div class="form-wrap"><div class="notice">This demo form opens WhatsApp with your details for you to review and send. It does not save data to a database.</div><form id="registrationForm"><div class="form-grid"><div class="field"><label>Student Full Name *</label><input name="studentName" required maxlength="100"></div><div class="field"><label>Parent / Guardian Name *</label><input name="parentName" required maxlength="100"></div><div class="field"><label>Mobile Number *</label><input name="mobile" type="tel" required pattern="[0-9+ -]{10,15}" maxlength="15"></div><div class="field"><label>Current Class *</label><select name="className" required><option value="">Select class</option><option>Class 5</option><option>Class 6</option><option>Class 7</option><option>Class 8</option><option>Class 9</option><option>Class 10</option><option>Intermediate</option><option>Other</option></select></div><div class="field full"><label>Course Interested In *</label><select name="course" required><option value="">Select course</option><option>NMMS Coaching</option><option>Gurukula Coaching</option><option>Mathematics</option><option>Advanced Mathematics</option><option>Mental Maths</option><option>English Grammar</option><option>Telugu</option><option>Computer Basics</option><option>Worksheets & Practice</option></select></div><div class="field full"><label>Additional Note (optional)</label><textarea name="note" maxlength="500" placeholder="Preferred timings or questions"></textarea></div><div class="field full"><button class="btn" type="submit">Continue on WhatsApp</button></div></div></form><p class="small">Check details before sending. Avoid sharing sensitive documents in public groups.</p></div></section></main><div id="site-footer"></div><script src="script.js"></script></body></html>
